name: inventory-demo
services:
  inventory-service:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      INVENTORY_DB_PATH: ${INVENTORY_DB_PATH:-/data/inventory.db}
    volumes:
      - inventory_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  inventory_data:

name: Inventory CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tests e imagen Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias de desarrollo
        run: python -m pip install -r requirements-dev.txt
      - name: Verificar dependencias y ejecutar tests
        run: |
          python -m pip check
          python -m unittest discover -s tests -v
      - name: Construir imagen del commit
        run: docker build --tag "inventory-service:${GITHUB_SHA}" .
      - name: Verificar API y persistencia en contenedor
        run: |
          docker volume create inventory-ci-data
          docker run -d --name inventory-ci -p 127.0.0.1:8000:8000 -v inventory-ci-data:/data "inventory-service:${GITHUB_SHA}"
          python scripts/smoke.py create
          docker restart inventory-ci
          python scripts/smoke.py verify
      - name: Logs y limpieza del contenedor de pruebas
        if: always()
        run: |
          docker logs inventory-ci || true
          docker rm -f inventory-ci || true
          docker volume rm inventory-ci-data || true
      - name: Guardar imagen validada
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save "inventory-service:${GITHUB_SHA}" | gzip > inventory-image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: inventory-image-${{ github.sha }}
          path: inventory-image.tar.gz
          compression-level: 0
          retention-days: 3

  publish:
    name: Publicar imagen en GHCR
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: inventory-image-${{ github.sha }}
      - name: Publicar la imagen validada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker load --input inventory-image.tar.gz
          docker tag "inventory-service:${GITHUB_SHA}" "${image}:${GITHUB_SHA}"
          docker tag "inventory-service:${GITHUB_SHA}" "${image}:latest"
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"
      - name: Cerrar sesión del registro
        if: always()
        run: docker logout ghcr.io
